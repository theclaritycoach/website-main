statuses:
  - { key: applied, label: Applied }
  - { key: under_review, label: Under Review }
  - { key: alignment_call_invited, label: Alignment Call Invited }
  - { key: alignment_call_scheduled, label: Alignment Call Scheduled }
  - { key: post_call_review, label: Post-Call Review }
  - { key: additional_info_requested, label: Additional Info Requested }
  - { key: approved_in_development, label: "Approved: In Development", description: "MOU, coursework, certification" }
  - { key: qualified_awaiting_assignment, label: "Qualified: Awaiting Assignment" }
  - { key: active_on_project, label: Active on Project }
  - { key: on_hold, label: On Hold }
  - { key: not_selected, label: Not Selected, is_terminal: true }
  - { key: withdrawn, label: Withdrawn, is_terminal: true }
  - { key: inactive, label: Inactive, is_terminal: true }

scorecards:
  application_review:
    - Relevant skills and experience
    - Interest in our practices
    - Professional communication
    - Availability and capacity
    - Willingness to train
    - Values alignment
    - Potential project fit
  post_call:
    - Professionalism
    - Communication
    - Systems thinking
    - AI aptitude
    - Learning readiness
    - Reliability
    - Availability
    - Values alignment
    - Understanding of the pathway
    - Client readiness
    - Team fit
    - Concerns or risks
    - Recommended next step

onboarding_steps:
  - MOU sent
  - MOU signed
  - Company alias email created
  - Anthropic Academy account created
  - Coursework registered
  - Coursework complete
  - Exam prep meeting
  - Exam scheduled
  - Subcontractor agreement and W-9 sent
  - Certification complete
  - Contractor documents complete
  - Final review
  - Portal access granted
  - Orientation complete

settings:
  retention_months:
    value: 24
    description: Months to keep Not Selected / Withdrawn records before automatic deletion (unless they updated their profile in that time).
  draft_retention_days:
    value: 30
    description: Days before an unsubmitted application and its resume are deleted.
  profile_refresh_days:
    value: 90
    description: Days after which a profile counts as stale (for the Phase 3 refresh reminder).

# CCE Talent Network catalog
# ---------------------------------------------------------------------------
# This is the one file to edit when you change practices, roles, skills,
# certifications, or any dropdown list on the form.
#
# After editing:  npm run seed:build   (regenerates supabase/seed.sql)
#                 npm run seed:apply   (pushes the changes to the database)
#
# Rules of thumb:
#   * `slug` is the permanent ID. Change the `name` freely; don't change the slug
#     once real applicants have used it.
#   * Removing an item from this file hides it (active = false). It doesn't
#     delete history for people who already selected it.
#   * Skills listed under a role are linked to that role. The same skill name
#     under two roles becomes one skill linked to both.
# ---------------------------------------------------------------------------

network:
  name: CCE Talent Network
  tagline: Develop People. Build Better Systems.
  public_base_url: https://talent.partnerwithcce.com

admins:
  - precious@theclaritycoach.co

# Skills every role shares
shared_skills:
  - Client communication
  - Stakeholder management
  - Written deliverables (reports, SOWs, decks)
  - Facilitation of working sessions
  - AI tool fluency (prompting, using AI in daily work)
  - Responsible AI use and data privacy basics
  - Reviewing and verifying AI output

practices:
  - slug: cross-practice
    name: Cross-practice
    description: Roles that can staff any engagement.
    is_cross_practice: true
    roles:
      - slug: client-delivery-lead
        name: Client Delivery Lead
        description: Owns the client relationship and delivery on an engagement.
        skills:
          - Engagement scoping
          - Client relationship management
          - Delivery planning
          - Executive communication
          - Risk and issue management
          - Scope and change control
          - Status reporting
          - Team coordination
      - slug: program-project-manager
        name: Program / Project Manager
        skills:
          - Project planning and scheduling
          - Gantt and timeline management
          - Resource planning
          - Budget tracking
          - Agile/Scrum
          - Risk management
          - Project tools (Asana, ClickUp, Monday, MS Project)
          - Government contract deliverables and compliance
      - slug: proposal-capture-manager
        name: Proposal / Capture Manager
        description: Leads RFP responses and capture planning for bids.
        skills:
          - Proposal management
          - Compliance matrices and RFP analysis
          - Capture planning
          - Proposal storyboarding and writing
          - Pricing and cost volume coordination
          - Past performance write-ups
          - Government procurement rules (federal, state, local)

  - slug: strategy-transformation
    name: Strategy & Transformation
    roles:
      - slug: transformation-consultant
        name: Transformation Consultant
        skills:
          - Organizational assessment
          - Strategic planning
          - Operating model design
          - Current/future state analysis
          - Org design
          - Executive advising
          - KPI and metrics design
      - slug: change-adoption-strategist
        name: Change & Adoption Strategist
        skills:
          - Change management methodology (Prosci ADKAR, Kotter)
          - Stakeholder analysis
          - Change impact assessment
          - Communication planning
          - Resistance management
          - Adoption measurement
          - Training needs analysis
          - AI adoption coaching
          - AI anxiety and trust building
      - slug: operations-business-systems-strategist
        name: Operations & Business Systems Strategist
        skills:
          - Process mapping
          - SOP development
          - Systems selection
          - CRM implementation
          - Workflow design
          - Operational reporting
          - Capacity planning
          - Tech stack audits
          - AI-ready knowledge capture (SOPs and knowledge bases people and AI can both use)
      - slug: process-improvement-specialist
        name: Process Improvement Specialist
        skills:
          - Lean
          - Six Sigma
          - Root cause analysis
          - Value stream mapping
          - Process documentation
          - Continuous improvement
          - Time and cost analysis
      - slug: brand-communications-strategist
        name: Brand & Communications Strategist
        skills:
          - Brand strategy
          - Messaging frameworks
          - Internal communications
          - Content strategy
          - Visual identity direction
          - Storytelling
          - Impact reporting

  - slug: ai-automation
    name: AI & Automation
    roles:
      - slug: ai-transformation-strategist
        name: AI Transformation Strategist
        skills:
          - AI readiness assessment
          - AI use case identification and prioritization
          - AI governance and policy
          - AI adoption roadmaps
          - ROI analysis for AI
          - Vendor and tool evaluation
          - AI training design for teams
          - Human-AI operating model design
          - AI value measurement after launch
      - slug: ai-solutions-architect
        name: AI Solutions Architect
        skills:
          - Solution architecture
          - LLM application design
          - Claude platform (API, Claude Code, Agent SDK, MCP)
          - Retrieval and knowledge systems (RAG)
          - Agent and workflow design
          - Integration architecture
          - Security and access design
          - Evaluation and testing of AI systems
          - Multi-agent system design
          - AI system observability and monitoring
      - slug: ai-engineer-developer
        name: AI Engineer / Developer
        skills:
          - Python
          - JavaScript/TypeScript
          - API integration
          - LLM APIs (Claude, OpenAI)
          - Agent development
          - MCP server development
          - Databases (Postgres, Supabase)
          - Cloud deployment (AWS, Azure, GCP, Netlify, Vercel)
          - Version control (Git)
          - Client-embedded delivery (forward-deployed)
          - Agent evaluation and testing
      - slug: automation-implementation-specialist
        name: Automation & Implementation Specialist
        skills:
          - Workflow automation (n8n, Zapier, Make)
          - No-code/low-code platforms
          - Airtable and Notion builds
          - CRM automation
          - Integration setup
          - Testing and QA
          - User documentation
          - AI agent builders (Copilot Studio, Claude, n8n AI nodes)
      - slug: data-analytics-specialist
        name: Data & Analytics Specialist
        skills:
          - Data analysis
          - Dashboards and reporting (Power BI, Looker, Tableau)
          - SQL
          - Data cleaning and modeling
          - Survey design and analysis
          - Data visualization
          - Data governance
          - Data readiness for AI
      - slug: ai-operations-specialist
        name: AI Operations Specialist
        description: Keeps AI agents and automations healthy after launch.
        skills:
          - Agent monitoring and maintenance
          - Evaluation and testing of AI systems
          - Prompt and workflow tuning
          - Incident response for AI systems
          - AI usage and cost tracking
          - Client support and handoff documentation
      - slug: ai-governance-risk-specialist
        name: AI Governance & Risk Specialist
        description: AI policy, risk assessment, and regulatory compliance.
        skills:
          - AI governance and policy
          - AI policy development
          - AI risk assessment
          - NIST AI Risk Management Framework
          - ISO/IEC 42001 AI management systems
          - AI regulatory requirements (TRAIGA, EU AI Act, sector rules)
          - AI vendor risk review
          - AI use disclosure and documentation

  - slug: people-workforce
    name: People & Workforce
    roles:
      - slug: leadership-development-consultant
        name: Leadership Development Consultant
        skills:
          - Leadership program design
          - Competency frameworks
          - 360 assessments
          - Succession planning
          - Executive development
          - Leadership assessments (DISC, StrengthsFinder, etc.)
          - Leading teams that include AI agents
      - slug: training-facilitator
        name: Training Facilitator
        description: Delivers live workshops and trainings, in person or virtual.
        skills:
          - Live workshop facilitation
          - Virtual facilitation (Zoom, Teams)
          - Group dynamics
          - Adult learning delivery
          - Keynote and large-group speaking
          - Train-the-trainer
          - Session evaluation
          - AI literacy workshop delivery
      - slug: learning-experience-designer
        name: Learning Experience Designer
        description: Designs curriculum, courses, and learning materials.
        skills:
          - Instructional design (ADDIE, SAM)
          - Curriculum development
          - eLearning authoring (Articulate, Rise, Canva)
          - LMS administration
          - Learning assessment design
          - Microlearning
          - Adult learning theory
          - AI-assisted course development
      - slug: executive-leadership-coach
        name: Executive / Leadership Coach
        skills:
          - One-on-one executive coaching
          - Team coaching
          - Coaching assessments
          - Goal setting and accountability
          - Career coaching
          - Difficult conversation coaching
      - slug: workforce-hr-strategist
        name: Workforce & HR Strategist
        skills:
          - Workforce planning
          - Talent acquisition strategy
          - Performance management systems
          - HR policy development
          - Compensation and job architecture
          - Employee engagement
          - Workforce development programs
          - Skills-based hiring and job architecture
          - AI in HR compliance (bias, disclosure)
      - slug: human-ai-work-design-strategist
        name: Human-AI Work Design Strategist
        description: Redesigns roles, workflows, and teams for people working alongside AI.
        skills:
          - Task and role analysis for AI
          - Human-AI workflow design
          - Skills taxonomy and skills-based job architecture
          - Reskilling and upskilling program design
          - Workforce impact assessment

# ---------------------------------------------------------------------------
# Certifications. EVERY entry starts as needs_verification: true.
# Names, codes, URLs, and prices change. Confirm each one, then set
# needs_verification: false and last_verified: YYYY-MM-DD.
# display_priority: lower numbers show first (Anthropic first, as a Claude Partner).
# approx_cost is left blank on purpose until verified.
# None of these are required, and CCE does not pay for them.
# ---------------------------------------------------------------------------
